#    UsedCodes=abcdefghijklmnopqrstuvwxyz,.
#    自然码编码规则: 码1=声母, 码2=韵母, 码3=主形码, 码4=次形码
#    2字词:ce2=p11+p21+,                 # 字1码1+字2码1+,          # 2字高频词简码
